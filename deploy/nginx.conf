# Incluir dentro del bloque http de nginx, por ejemplo en /etc/nginx/conf.d/doblonia.conf.
# Requiere un certificado ya emitido para doblonia.io y el juego en 127.0.0.1:2567.
map $http_upgrade $doblonia_connection {
    default upgrade;
    '' close;
}
map $http_upgrade $doblonia_socket_key {
    default '';
    ~*websocket $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=doblonia_join:10m rate=2r/s;
limit_conn_zone $doblonia_socket_key zone=doblonia_sockets:10m;

# No registrar la query: contiene identificadores y tokens de reconexión.
log_format doblonia '$remote_addr - $time_local "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name doblonia.io;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 308 https://doblonia.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name doblonia.io;
    ssl_certificate /etc/letsencrypt/live/doblonia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doblonia.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/doblonia-access.log doblonia;
    # Los errores detallados pueden contener la URL completa. Activar solo al diagnosticar.
    error_log /var/log/nginx/doblonia-error.log crit;
    client_max_body_size 8k;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $doblonia_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;

    location /matchmake/ {
        limit_req zone=doblonia_join burst=10 nodelay;
        proxy_pass http://127.0.0.1:2567;
    }
    location / {
        limit_conn doblonia_sockets 12;
        proxy_pass http://127.0.0.1:2567;
    }
}
